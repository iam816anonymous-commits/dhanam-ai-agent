name: Android Emulator Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: Instrumented Room and emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and instrumented test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests on a virtual Android device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: |
            mkdir -p app/build/ci-diagnostics
            set +e
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
            result=$?
            adb devices -l > app/build/ci-diagnostics/adb-devices.txt 2>&1 || true
            adb logcat -d -t 12000 > app/build/ci-diagnostics/logcat.txt 2>&1 || true
            find app/build/reports/androidTests -maxdepth 5 -type f -print > app/build/ci-diagnostics/test-reports.txt 2>&1 || true
            exit $result

      - name: Upload emulator diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: app/build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
